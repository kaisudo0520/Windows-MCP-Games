[project]
name = "sts-game-mcp"
version = "0.1.0"
description = "Minimal stdio MCP server that captures and drives a single bound Slay the Spire window on Windows 10. Derived from CursorTouch/Windows-MCP."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "mss>=10.0",
    "pillow>=11.0",
    "pywin32>=311",
    "psutil>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
sts-game-mcp = "game_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/game_mcp/vendor/*.py" = ["E", "W", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real desktop session (creates a test window, moves the cursor)",
]
